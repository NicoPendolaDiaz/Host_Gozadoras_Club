<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gozadoras Club - Mapa de la Vida Erótica</title>
<style>
  :root {
    --brand-dark: #2A3626; /* Dark Green */
    --brand-light: #F0EEE4; /* Warm Beige */
    --brand-accent: #E85D04; /* Orange */
  }
  body, html {
    margin: 0; padding: 0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: var(--brand-light);
    color: var(--brand-dark);
    height: 100%; width: 100%;
    overflow: hidden;
  }
  .screen {
    display: none;
    flex-direction: column;
    height: 100%;
    width: 100%;
    box-sizing: border-box;
    padding: 24px;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .screen.active {
    display: flex;
    animation: fadeIn 0.4s ease-in-out;
  }
  @keyframes fadeIn { from {opacity: 0} to {opacity: 1} }
  
  h1, h2, h3 { font-weight: normal; }
  .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; margin-bottom: 40px; }
  .bubble {
    font-size: 22px;
    line-height: 1.4;
    max-width: 500px;
    margin-bottom: 24px;
  }
  #pcap {
    font-size: 14px;
    color: #666;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .qbody {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    padding-bottom: 20px;
  }
  .opt-btn {
    background: transparent;
    border: 2px solid var(--brand-dark);
    color: var(--brand-dark);
    padding: 14px 20px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    min-height: 44px; /* A11y target */
    text-align: left;
  }
  .opt-btn:hover { background: rgba(42,54,38,0.05); }
  .opt-btn.selected {
    background: var(--brand-dark);
    color: var(--brand-light);
  }
  .opt-btn.out-scale {
    margin-top: 12px;
    border-style: dashed;
  }
  
  textarea {
    width: 100%;
    height: 120px;
    padding: 14px;
    font-size: 16px;
    border: 2px solid var(--brand-dark);
    border-radius: 8px;
    background: transparent;
    color: var(--brand-dark);
    box-sizing: border-box;
    resize: none;
    font-family: inherit;
  }
  
  .action-btns {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    justify-content: space-between;
    width: 100%;
  }
  .btn {
    padding: 14px 24px;
    font-size: 16px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    border: none;
    min-height: 44px;
    flex: 1;
  }
  .btn-primary {
    background: var(--brand-accent);
    color: white;
  }
  .btn-primary:disabled {
    background: #ccc;
    cursor: not-allowed;
  }
  .btn-sec {
    background: transparent;
    border: 2px solid var(--brand-dark);
    color: var(--brand-dark);
  }
  
  /* Density Field specific */
  .density-bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(42,54,38,0.2) 10px, rgba(42,54,38,0.2) 20px);
    z-index: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
</style>
</head>
<body>

  <!-- SPLASH -->
  <section id="s-splash" class="screen">
    <div class="logo">GOZADORAS CLUB</div>
    <h1>Mapa de la Vida Erótica</h1>
    <p class="bubble" style="margin-top:20px;">Tu vida erótica no es un territorio fijo. Recorrer este mapa es mirar ese paisaje y descubrir qué empieza a tomar forma desde ahí.</p>
    <button class="btn btn-primary" style="margin-top:40px; max-width:200px" onclick="go('s-info'); renderQuestion('PRE01')">Comenzar</button>
  </section>

  <!-- INFO SCREENS (PRE01) -->
  <section id="s-info" class="screen">
    <h2 id="i-title" style="margin-bottom: 24px;"></h2>
    <p id="i-text" class="bubble" style="text-align: left; white-space: pre-wrap; font-size: 18px;"></p>
    <div class="action-btns" style="max-width:500px">
      <button class="btn btn-primary" id="i-next"></button>
    </div>
  </section>

  <!-- LANDSCAPE TRANSITIONS -->
  <section id="s-landscape" class="screen" style="background-color: var(--brand-dark); color: var(--brand-light);">
    <h2 id="l-title" style="letter-spacing: 4px; color: var(--brand-accent); margin-bottom: 24px;"></h2>
    <p id="l-text" class="bubble"></p>
    <div class="action-btns" style="max-width:300px; margin-top:40px;">
      <button class="btn btn-primary" id="l-next">Avanzar</button>
    </div>
  </section>

  <!-- QUESTION CORE -->
  <section id="s-q" class="screen" style="justify-content: flex-start; padding-top: 40px;">
    <div id="bubble" class="bubble"></div>
    <b id="pcap"></b>
    <div id="qbody" class="qbody"></div>
  </section>

  <script src="data.js"></script>
  <script src="engine.js"></script>
</body>
</html>
